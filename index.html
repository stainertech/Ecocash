
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>MyWallet - Demo Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #fff;
}

.container {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.top-section {
    flex: 1;
    background: #fff;
    padding: 0 22px 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    justify-content: flex-start;
}

.logo {
    margin-top: 12vh;
    margin-bottom: 38px;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: -1px;
}

.logo span:first-child {
    color: #2472b9;
}

.logo span:last-child {
    color: #d64c58;
}

h3 {
    color: #555;
    font-size: 21px;
    margin-bottom: 35px;
}

.phone-box {
    width: 100%;
    height: 54px;
    border: 1.5px solid #8799aa;
    border-radius: 7px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
}

.phone-box select {
    width: 88px;
    border: none;
    outline: none;
    background: transparent;
    color: #666;
    font-size: 13px;
    padding: 8px 0;
}

.phone-box input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 14px;
    background: transparent;
    height: 100%;
}

.phone-box input:focus {
    outline: none;
}

.hint {
    color: #888;
    font-size: 13px;
    margin-top: 17px;
    margin-bottom: 20px;
}

.pin-container {
    display: flex;
    gap: 7px;
    justify-content: center;
}

.pin-container input {
    width: 45px;
    height: 51px;
    border: 1.5px solid #8498aa;
    border-radius: 8px;
    text-align: center;
    font-size: 22px;
    outline: none;
    background: #fff;
}

.pin-container input:focus {
    border: 2px solid #2775bc;
    box-shadow: 0 0 4px #a4c8e9;
}

.bottom-section {
    background: #2679c3;
    min-height: 310px;
    width: 100%;
    padding: 105px 20px 25px;
    position: relative;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    clip-path: ellipse(100% 100% at 50% 100%);
    margin-top: -35px;
}

.bottom-section p {
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 27px;
}

.buttons {
    display: flex;
    gap: 10px;
    width: 100%;
}

.action-btn {
    flex: 1;
    min-height: 70px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #777;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    transition: .2s;
}

.action-btn:active {
    transform: scale(.97);
    background: #eaf3fb;
}

.action-btn .symbol {
    color: #2876b8;
    font-size: 19px;
    font-weight: bold;
}

.version {
    margin-top: auto;
    padding-top: 35px;
    text-align: center;
    font-size: 11px;
    line-height: 2;
    color: #fff;
}

.version a {
    color: white;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 340px;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    color: #555;
}

.modal-content h3 {
    margin-bottom: 15px;
}

.modal-content p {
    font-size: 14px;
    line-height: 1.6;
}

.close-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    background: #2679c3;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 14px;
}

.notice {
    margin-top: 15px;
    font-size: 12px;
    color: #777;
    text-align: center;
}

@media(max-height: 650px) {
    .logo {
        margin-top: 35px;
        margin-bottom: 20px;
    }

    h3 {
        margin-bottom: 20px;
    }

    .bottom-section {
        min-height: 250px;
        padding-top: 75px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-section">

        <div class="logo">
            <span>Eco</span><span>Cash</span>
        </div>

        <h3>Login</h3>

        <div class="phone-box">

            <select id="country"
                <option value="+263">🇿🇼 +263</option>
                <option value="+256">🇺🇬 +256</option>
                <option value="+255">🇹🇿 +255</option>
                <option value="+260">🇿🇲 +260</option>
                <option value="+27">🇿🇦 +27</option>
            </select>

            <input
                type="tel"
                id="phone"
                inputmode="numeric"
                autocomplete="off"
            >

        </div>

        <div class="hint">Enter your PIN</div>

        <div class="pin-container">
            <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
        </div>

        <div class="notice">
        Logging you in....
        </div>

    </div>

    <div class="bottom-section">

        <p>
            To register an ecocash wallet or get assistance, click below 
        </p>

        <div class="buttons">

            <button class="action-btn" disable="showModal('register')">
                <span class="symbol">♟</span>
                Register
            </button>

            <button class="action-btn" disable="showModal('help')">
                <span class="symbol">ⓘ</span>
                Help & Support
            </button>

        </div>

        <div class="version">
            v1.0 DEMO<br>
            By continuing, you agree to the
            <a href="#" disable="showModal('terms');return false;">Terms and Conditions</a>
        </div>

    </div>

</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="modal-title">Information</h3>
        <p id="modal-message"></p>
        <button class="close-btn" disable="closeModal()">Close</button>
    </div>
</div>

<script>

// PIN BOX INTERACTIONS
const pinInputs = document.querySelectorAll('.pin-container input');

pinInputs.forEach((input, index) => {

    input.addEventListener('input', () => {

        input.value = input.value.replace(/\D/g, '').slice(0, 1);

        if (input.value && index < pinInputs.length - 1) {
            pinInputs[index + 1].focus();
        }

        if (index === pinInputs.length - 1 && input.value) {
            input.blur();
        }

    });

    input.addEventListener('keydown', (event) => {

        if (event.key === 'Backspace' && !input.value && index > 0) {
            pinInputs[index - 1].focus();
        }

    });

});

// SUPPORT BUTTONS
function showModal(type) {

    const title = document.getElementById('modal-title');
    const message = document.getElementById('modal-message');
    const modal = document.getElementById('modal');

    if (type === 'register') {
        title.textContent = 'Registration';
        message.textContent =
        'Welcome to the MyWallet demonstration. Registration is not connected to a real wallet service.';
    }

    else if (type === 'help') {
        title.textContent = 'Help & Support';
        message.textContent =
        'This is a demonstration interface. No real wallet accounts or transactions are supported.';
    }

    else {
        title.textContent = 'Terms and Conditions';
        message.textContent =
        'This is an independent demonstration interface and is not affiliated with any financial institution.';
    }

    modal.style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

document.getElementById('modal').addEventListener('click', function(event) {
    if (event.target === this) {
        closeModal();
    }
});

</script>

</body>
</html>
